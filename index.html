<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vestro Chat</title>
    <link rel="stylesheet" href="./Css/styles.css">
</head>

<body>

    <nav>
        <img class="logo" src="./logo.png" alt="Vestro Chat">

        <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark mode">
            <svg id="themeIcon" class="theme-icon" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="4" fill="currentColor"/>
                <path d="M12 2V4M12 20V22M4.93 4.93L6.34 6.34M17.66 17.66L19.07 19.07M2 12H4M20 12H22M4.93 19.07L6.34 17.66M17.66 6.34L19.07 4.93"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"/>
            </svg>
        </button>
    </nav>

    <div class="container"></div>

    <div class="send">
        <form id="send-container">
            <input
                type="text"
                name="messageInp"
                id="messageInp"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button type="submit" class="btn">
                Send
            </button>
        </form>
    </div>

    <script src="http://localhost:8000/socket.io/socket.io.js"></script>
    <script src="./js/client.js"></script>

</body>
</html>
